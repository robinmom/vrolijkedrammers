version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]
      dotnet-test:
        patterns: ['Microsoft.NET.Test.Sdk', 'xunit*', 'coverlet*']
    ignore:
      # ImageSharp 4 vraagt bij een Release-build een licentiesleutel; we blijven op 3.x (fase 5).
      - dependency-name: 'SixLabors.ImageSharp'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Expo legt deze versies per SDK vast; bijwerken gaat samen met een SDK-upgrade via `npx expo install`.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'
      - dependency-name: 'jest'
      - dependency-name: '@types/jest'
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: '@react-native-community/netinfo'
      # De typen volgen de Node-versie van CI en deploy (22); een nieuwere major pas samen met die upgrade.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Nieuwe majors pas als typescript-eslint en eslint-plugin-react ze ondersteunen (fase 0).
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
