# Dagelijkse controle van npm-pakketten. Faalt (en GitHub mailt) als:
# - er op main een nieuwe high/critical-kwetsbaarheid is (CI draait alleen bij een push of PR), of
# - er voor een uitzondering in pnpm-workspace.yaml (auditConfig.ignoreGhsas) een gepatchte versie is: dan kan de
#   uitzondering eruit en het pakket worden bijgewerkt.
# Uitzondering: zet [geen-bruikbare-patch] in de comment boven een GHSA als er wél een patch bestaat maar wij die niet
# kunnen nemen (bijv. een major-upgrade van een transitieve dep die Expo pint). Dan stopt de dagelijkse nag voor die ene.
name: Dagelijkse audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm-audit en uitzonderingen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Kwetsbare npm-pakketten (high/critical)
        run: pnpm audit --audit-level high
      - name: Uitzonderingen nog nodig?
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          mark=0
          # Loop door de ignoreGhsas-sectie; de comment boven een GHSA kan die als bewust-niet-patchbaar markeren.
          while IFS= read -r line; do
            case "$line" in
              *GHSA-*)
                id=$(printf '%s' "$line" | grep -oE 'GHSA-[a-z0-9-]+')
                [ -z "$id" ] && continue
                if [ "$mark" = 1 ]; then
                  echo "$id: bewust genegeerd (geen bruikbare patch voor ons), geen actie."
                else
                  patched=$(gh api "/advisories/$id" --jq '[.vulnerabilities[] | select(.first_patched_version != null) | "\(.package.name) \(.first_patched_version)"] | join(", ")')
                  if [ -n "$patched" ]; then
                    echo "::error::$id heeft nu een patch ($patched): werk het pakket bij en haal de uitzondering uit pnpm-workspace.yaml."
                    status=1
                  else
                    echo "$id: nog geen patch, uitzondering blijft nodig."
                  fi
                fi
                mark=0
                ;;
              *"#"*)
                case "$line" in
                  *"[geen-bruikbare-patch]"*) mark=1 ;;
                  *) mark=0 ;;
                esac
                ;;
            esac
          done < <(sed -n '/ignoreGhsas:/,/^[^ #]/p' pnpm-workspace.yaml)
          exit $status
