# CI voor elke pull request en push naar main (docs/08 §7, docs/16).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET – build, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Drammers.sln
      - run: dotnet tool restore
      - name: Build (warnings = fouten)
        run: dotnet build Drammers.sln --no-restore -c Release
      - name: Formattering
        run: dotnet format Drammers.sln --verify-no-changes --no-restore
      - name: Tests (incl. integratietests tegen SQL Server in Docker)
        run: dotnet test Drammers.sln --no-build -c Release
      - name: Geen modelwijzigingen zonder migratie
        run: dotnet ef migrations has-pending-model-changes -p src/Drammers.Infrastructure -s src/Drammers.Infrastructure --no-build --configuration Release
      - name: Kwetsbare NuGet-pakketten
        run: |
          dotnet list Drammers.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -E "Critical|High" vulnerable.txt
      - name: OpenAPI-document is actueel
        run: git diff --exit-code -- openapi/

  javascript:
    name: TypeScript – lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Iconen zijn gegenereerd uit assets/icons
        run: |
          pnpm --filter @drammers/mobile icons
          git diff --exit-code -- apps/mobile/src/ui/icons.generated.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Portal bouwt
        run: pnpm --filter @drammers/admin build
      - name: Kwetsbare npm-pakketten (high/critical)
        run: pnpm audit --audit-level high

  infra:
    name: Bicep – lint en build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (waarschuwingen = fouten)
        run: |
          az bicep install
          for file in infra/main.bicep infra/bootstrap/nonprod.bicep; do
            az bicep lint --file "$file" --diagnostics-format sarif > lint.sarif
            jq -e '[.runs[].results[]] | length == 0' lint.sarif || { jq '.runs[].results[]' lint.sarif; exit 1; }
          done
      - name: Parameterbestanden bouwen
        env:
          DVD_APP_SERVICE_PLAN_ID: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg/providers/Microsoft.Web/serverfarms/plan
          DVD_SQL_ADMIN_GROUP_OBJECT_ID: 00000000-0000-0000-0000-000000000000
        run: |
          for env in dev acc; do az bicep build-params --file "infra/env/$env.bicepparam" --stdout > /dev/null; done
      - name: Shellscripts
        run: shellcheck -x infra/bootstrap/*.sh infra/entra/*.sh

  infra-what-if:
    name: Bicep – what-if Dev
    # Alleen voor pull requests uit deze repository (de federatie vertrouwt alleen het pull_request-subject;
    # op main doet de Deploy-workflow zelf een what-if) en als de what-if-identiteit is ingericht.
    if: >-
      vars.AZURE_WHATIF_CLIENT_ID != '' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DVD_APP_SERVICE_PLAN_ID: ${{ vars.DVD_APP_SERVICE_PLAN_ID }}
      DVD_SQL_ADMIN_GROUP_OBJECT_ID: ${{ vars.DVD_DEV_SQL_ADMIN_GROUP_OBJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_WHATIF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (alleen-lezen identiteit; RBAC-controle op schrijven overgeslagen)
        run: |
          az deployment group what-if --resource-group rg-dvd-dev --name dvd-dev-pr \
            --template-file infra/main.bicep --parameters infra/env/dev.bicepparam \
            --validation-level ProviderNoRbac 2> what-if-error.txt || {
            cat what-if-error.txt
            echo "::error title=what-if::$(tr '\n' ' ' < what-if-error.txt | cut -c1-1500)"
            exit 1
          }

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
