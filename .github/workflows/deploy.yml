# Uitrol naar Dev (automatisch na merge op main) of Acc (handmatig) — docs/08 §7, fase 1.
# Aanmelden bij Azure via OIDC met de managed identity van de GitHub environment; geen secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Omgeving
        type: choice
        options: [dev, acc]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build API + portal
    # Pas actief nadat de bootstrap en de GitHub-variabelen zijn ingericht (runbook omgeving-opbouwen §2).
    if: vars.DVD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish API
        run: dotnet publish src/Drammers.Api -c Release -o publish/api -p:SourceRevisionId=${{ github.sha }}
      - name: Migratiescript (idempotent) en databasetool
        run: |
          dotnet tool restore
          dotnet ef migrations script --idempotent -p src/Drammers.Infrastructure -s src/Drammers.Infrastructure \
            -o publish/db/migrations.sql
          dotnet publish tools/Drammers.DbSetup -c Release -o publish/db/tool
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build portal en meeleveren in de API (wwwroot/beheer, OQ-76)
        run: |
          pnpm --filter @drammers/admin build
          rm -rf publish/api/wwwroot/beheer
          mkdir -p publish/api/wwwroot
          cp -r apps/admin/dist publish/api/wwwroot/beheer
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish/api
      - uses: actions/upload-artifact@v4
        with:
          name: db
          path: publish/db

  deploy:
    name: Uitrol ${{ inputs.environment || 'dev' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      RESOURCE_GROUP: rg-dvd-${{ inputs.environment || 'dev' }}
      DVD_APP_SERVICE_PLAN_ID: ${{ vars.DVD_APP_SERVICE_PLAN_ID }}
      DVD_SQL_ADMIN_GROUP_OBJECT_ID: ${{ vars.DVD_SQL_ADMIN_GROUP_OBJECT_ID }}
      DVD_API_CLIENT_ID: ${{ vars.DVD_API_CLIENT_ID }}
      DVD_ENVIRONMENT_ACCESS_CLAIM: ${{ vars.DVD_ENVIRONMENT_ACCESS_CLAIM }}
      DVD_BUDGET_EMAIL: ${{ vars.DVD_BUDGET_EMAIL }}
      DVD_BOOTSTRAP_ADMIN: ${{ vars.DVD_BOOTSTRAP_ADMIN }}
      DVD_GRAPH_CLIENT_ID: ${{ vars.DVD_GRAPH_CLIENT_ID }}
      DVD_PORTAL_CLIENT_ID: ${{ vars.DVD_PORTAL_CLIENT_ID }}
      DVD_GRAPH_CERTIFICATE_NAME: ${{ vars.DVD_GRAPH_CERTIFICATE_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Infrastructuur – what-if
        run: |
          az deployment group what-if --resource-group "$RESOURCE_GROUP" --name "dvd-$ENVIRONMENT" \
            --template-file infra/main.bicep --parameters "infra/env/$ENVIRONMENT.bicepparam"

      - name: Infrastructuur – uitrol
        id: infra
        run: |
          outputs=$(az deployment group create --resource-group "$RESOURCE_GROUP" --name "dvd-$ENVIRONMENT" \
            --template-file infra/main.bicep --parameters "infra/env/$ENVIRONMENT.bicepparam" \
            --query properties.outputs -o json)
          echo "api-app=$(jq -r .apiAppName.value <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "api-url=$(jq -r .apiUrl.value <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "api-client-id=$(jq -r .apiIdentityClientId.value <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "sql-server=$(jq -r .sqlServerFqdn.value <<<"$outputs")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: db
          path: publish/db
      - name: Database – migraties en API-identiteit (vóór de app; een fout stopt de deploy)
        run: |
          # Tijdelijke firewallregel voor deze runner; wordt altijd weer verwijderd.
          rule="github-runner-$GITHUB_RUN_ID"
          ip=$(curl -sf https://api.ipify.org)
          az sql server firewall-rule create -g "$RESOURCE_GROUP" -s "sql-dvd-$ENVIRONMENT" -n "$rule" \
            --start-ip-address "$ip" --end-ip-address "$ip" -o none
          trap 'az sql server firewall-rule delete -g "$RESOURCE_GROUP" -s "sql-dvd-$ENVIRONMENT" -n "$rule" -o none' EXIT
          server="${{ steps.infra.outputs.sql-server }}"
          dotnet publish/db/tool/Drammers.DbSetup.dll "$server" sqldb-dvd migrate publish/db/migrations.sql
          dotnet publish/db/tool/Drammers.DbSetup.dll "$server" sqldb-dvd ensure-user \
            "${{ steps.infra.outputs.api-app }}" "${{ steps.infra.outputs.api-client-id }}" app_runtime
          # Eerste beheerder (optioneel, idempotent): variabele "oid;e-mail;naam" in de GitHub environment.
          if [[ -n "${DVD_BOOTSTRAP_ADMIN:-}" ]]; then
            IFS=';' read -r admin_oid admin_email admin_name <<<"$DVD_BOOTSTRAP_ADMIN"
            dotnet publish/db/tool/Drammers.DbSetup.dll "$server" sqldb-dvd bootstrap-admin "$admin_oid" "$admin_email" "$admin_name"
          fi

      - name: Wachten tot de app stabiel is na infra-wijzigingen
        run: |
          # Een gewijzigde app-instelling herstart de site inclusief Kudu; een zip-deploy die dan start, wordt
          # afgebroken ("Deployment has been stopped due to SCM container restart"). Wacht tot Kudu reageert.
          scm="https://${{ steps.infra.outputs.api-app }}.scm.azurewebsites.net/api/deployments"
          sleep 30
          for attempt in $(seq 1 20); do
            if az rest --method get --url "$scm" --resource https://management.azure.com/ -o none 2>/dev/null; then
              echo "Kudu bereikbaar (poging $attempt)"; exit 0
            fi
            sleep 15
          done
          echo "::error::Kudu niet bereikbaar na infra-uitrol"; exit 1
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish/api
      - name: API + portal – uitrol
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.api-app }}
          package: publish/api

      - name: Draait de nieuwe versie?
        run: |
          # Een herstart door gewijzigde app-instellingen kan vóór het plaatsen van het pakket vallen; dan draait de
          # oude versie door. Wacht op de nieuwe commit en herstart zo nodig één keer.
          url="${{ steps.infra.outputs.api-url }}/health/live"
          wait_for_version() {
            for attempt in $(seq 1 12); do
              version=$(curl -s -D - -o /dev/null --max-time 30 "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-app-version"{print $2}')
              echo "poging $attempt: ${version:-geen antwoord}"
              [[ "$version" == *"$GITHUB_SHA"* ]] && return 0
              sleep 15
            done
            return 1
          }
          wait_for_version && exit 0
          echo "Oude versie draait nog; app herstarten"
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "${{ steps.infra.outputs.api-app }}"
          wait_for_version
      - name: Smoke-test – /health/ready
        run: |
          # De serverless database kan gepauzeerd zijn; hervatten duurt tot ~1 minuut.
          for attempt in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.infra.outputs.api-url }}/health/ready" || true)
            echo "poging $attempt: $status"
            [[ "$status" == "200" ]] && exit 0
            sleep 15
          done
          exit 1
      - name: Smoke-test – portal
        run: |
          curl -sf "${{ steps.infra.outputs.api-url }}/beheer/" | grep -q '<div id="root">'
      - name: Smoke-test – anonieme blob-toegang geweigerd
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://stdvd$ENVIRONMENT.blob.core.windows.net/exports?restype=container&comp=list")
          echo "anoniem: $status"
          [[ "$status" == "401" || "$status" == "403" || "$status" == "409" ]]
      - name: Smoke-test – SQL alleen Entra-authenticatie
        run: |
          only_entra=$(az sql server ad-only-auth get --resource-group "$RESOURCE_GROUP" --name "sql-dvd-$ENVIRONMENT" --query azureAdOnlyAuthentication -o tsv)
          echo "azureADOnlyAuthentication: $only_entra"
          [[ "$only_entra" == "true" ]]
