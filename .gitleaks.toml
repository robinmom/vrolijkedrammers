# Gitleaks: standaardregels plus een smalle allowlist voor bekende valse meldingen.
# Klassieke [allowlist]-syntaxis: werkt ook met de oudere gitleaks-versie van gitleaks-action.
[extend]
useDefault = true

[allowlist]
description = "Publieke ID's van ingebouwde Azure-roldefinities en portalroutes in e2e-tests (geen geheimen)"
regexTarget = "match"
regexes = [
  # Azure-rol Key Vault Secrets User.
  '''4633458b-17de-408a-b874-0445c86b69e6''',
  # Portalroute in e2e: `open(page, api, 'optocht/inschrijvingen')` lijkt voor generic-api-key op "api = <sleutel>".
  '''api, 'optocht/inschrijvingen''',
]
