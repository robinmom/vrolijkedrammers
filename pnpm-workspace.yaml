packages:
  - apps/*
  - packages/*

# Expo/React Native werkt het betrouwbaarst met een platte node_modules-structuur (docs.expo.dev/guides/monorepos).
nodeLinker: hoisted

# Installatiescripts van pakketten staan standaard uit (supply-chain-bescherming).
# Alleen hier expliciet benoemde pakketten worden beoordeeld; false = script bewust niet uitvoeren.
allowBuilds:
  unrs-resolver: false

# Eén React-versie in de hele monorepo (app en portal); twee versies naast elkaar geven "invalid hook call"-fouten.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  # GHSA-68fv-2mgg-jv7q (2026-10-06): alleen via vite/postcss/jsdom (testtooling); 1.2.2 is gepatcht.
  source-map-js: ^1.2.2
  # GHSA-pqg4-j6r4-53mv (2026-10-06): alleen via react-devtools-core (Expo-ontwikkeltools); 1.11.0 is gepatcht.
  shell-quote: ^1.11.0

# Bewuste uitzonderingen op `pnpm audit` (CI-stap "Kwetsbare npm-pakketten"). Alleen voor advisories zonder
# gepatchte versie en buiten de geleverde app. De workflow "Dagelijkse audit" faalt zodra er een patch is.
auditConfig:
  ignoreGhsas:
    # node-forge <=1.4.0 (2026-10-02): alleen via @expo/cli (bouwtooling), zit niet in de app-bundel.
    - GHSA-86w9-cpqp-85rv
    # braces (2026-10-03): alleen via Metro (bundler van Expo), zit niet in de app-bundel.
    - GHSA-vfj7-8cjw-p6xm
